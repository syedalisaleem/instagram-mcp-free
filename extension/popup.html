<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>IG MCP Bridge</title>
    <style>
      body {
        width: 300px;
        margin: 0;
        padding: 14px 16px;
        font: 13px/1.45 system-ui, -apple-system, Segoe UI, sans-serif;
        color: #1a1a1a;
        background: #fff;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 10px;
      }
      .state {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #c4c4c4;
        flex: none;
      }
      .dot.on {
        background: #1db954;
      }
      .dot.busy {
        background: #f5a623;
      }
      .meta {
        color: #666;
        margin: 6px 0 0;
        word-break: break-all;
      }
      label {
        display: block;
        margin-top: 14px;
        color: #666;
        font-size: 12px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        margin-top: 4px;
        padding: 6px 7px;
        font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
        border: 1px solid #d5d5d5;
        border-radius: 5px;
      }
      button {
        margin-top: 9px;
        width: 100%;
        padding: 7px;
        font: 13px system-ui, sans-serif;
        border: 1px solid #cfcfcf;
        border-radius: 6px;
        background: #f6f6f6;
        cursor: pointer;
      }
      button:hover {
        background: #ededed;
      }
      .hint {
        margin: 12px 0 0;
        color: #888;
        font-size: 11.5px;
      }
    </style>
  </head>
  <body>
    <h1>IG MCP Bridge</h1>

    <div class="state"><span id="dot" class="dot"></span><span id="label">Checking…</span></div>
    <p id="meta" class="meta"></p>

    <label>
      Driver address
      <input id="url" spellcheck="false" />
    </label>
    <button id="save">Save &amp; reconnect</button>

    <p class="hint">
      Pairing is automatic — no toggle. Keep instagram.com signed in and the bridge will find
      your session on the first tool call.
    </p>

    <script src="popup.js"></script>
  </body>
</html>
